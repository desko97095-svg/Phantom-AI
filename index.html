<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHANTOM AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #08080D;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }

  :root {
    --cyan: #00F0FF;
    --magenta: #FF2ED1;
    --purple: #7B2FFF;
    --panel: #0D0D15;
    --text: #EDEDF5;
    --muted: #8B8BA3;
  }

  @keyframes borderShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-30px) scale(1.08); } }
  @keyframes blinkDot { 0%,80%,100% { opacity: 0.25; transform: translateY(0px); } 40% { opacity: 1; transform: translateY(-3px); } }
  @keyframes pulseRing { 0%,100% { box-shadow: 0 0 0 0 rgba(0,240,255,0.35); } 50% { box-shadow: 0 0 0 6px rgba(0,240,255,0); } }
  @keyframes onlineDot { 0%,100% { box-shadow: 0 0 4px 1px rgba(57,255,20,0.8); } 50% { box-shadow: 0 0 10px 3px rgba(57,255,20,0.9); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0px); } }

  .blob { position: absolute; border-radius: 50%; filter: blur(60px); animation: floatBlob 9s ease-in-out infinite; pointer-events: none; }
  .blob-1 { top: -8%; left: -8%; width: 300px; height: 300px; background: var(--purple); opacity: 0.22; }
  .blob-2 { bottom: -10%; right: -8%; width: 320px; height: 320px; background: var(--cyan); opacity: 0.16; animation-delay: 3s; }

  .rgb-border {
    width: 100%;
    max-width: 440px;
    border-radius: 28px;
    padding: 2px;
    position: relative;
    z-index: 1;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta), var(--cyan));
    background-size: 300% 300%;
    animation: borderShift 6s ease infinite;
  }

  .card {
    border-radius: 26px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    height: 80vh;
    max-height: 640px;
    overflow: hidden;
  }

  .header {
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    display: flex; align-items: center; justify-content: center;
    animation: pulseRing 2.4s infinite;
    font-size: 20px;
  }

  .title {
    font-weight: 800; font-size: 17px; letter-spacing: 1px;
    background-image: linear-gradient(90deg, var(--cyan), var(--magenta), var(--purple), var(--cyan));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradientShift 4s ease infinite;
  }

  .status { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #39FF14; animation: onlineDot 1.6s infinite; }
  .status-text { font-size: 11px; color: var(--muted); }

  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(123,47,255,0.4); border-radius: 10px; }

  .msg-row { display: flex; gap: 8px; align-items: flex-end; animation: msgIn 0.35s ease forwards; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .msg-avatar.bot { background: rgba(0,240,255,0.12); border: 1px solid rgba(0,240,255,0.35); }
  .msg-avatar.user { background: linear-gradient(135deg, var(--magenta), var(--purple)); }

  .bubble { max-width: 78%; padding: 9px 13px; font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .bubble.bot { border-radius: 15px 15px 15px 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,240,255,0.15); }
  .bubble.user { border-radius: 15px 15px 4px 15px; background: linear-gradient(135deg, var(--magenta), var(--purple)); }

  .typing-dots { display: flex; gap: 4px; padding: 11px 15px; border-radius: 15px 15px 15px 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,240,255,0.15); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: blinkDot 1.4s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .input-row { padding: 12px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 8px; align-items: center; }
  .input-wrap { flex: 1; border-radius: 999px; padding: 2px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
  .input-wrap.focused { background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--purple)); }
  input[type="text"] { width: 100%; border: none; outline: none; background: var(--panel); color: var(--text); font-size: 14px; padding: 10px 15px; border-radius: 999px; box-sizing: border-box; font-family: inherit; }

  .send-btn { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--cyan), var(--purple)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 14px rgba(0,240,255,0.4); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .send-btn svg { width: 17px; height: 17px; }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="rgb-border">
    <div class="card">
      <div class="header">
        <div class="avatar">🤖</div>
        <div style="flex:1; min-width:0;">
          <div class="title">PHANTOM AI</div>
          <div class="status">
            <span class="status-dot"></span>
            <span class="status-text">онлайн · личен асистент</span>
          </div>
        </div>
        <div style="color: var(--cyan); opacity: 0.7;">✨</div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-row">
        <div class="input-wrap" id="inputWrap">
          <input type="text" id="input" placeholder="Напиши съобщение..." />
        </div>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const inputWrapEl = document.getElementById('inputWrap');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];
  let loading = false;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    history.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + (m.role === 'user' ? 'user' : '');

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ' + (m.role === 'user' ? 'user' : 'bot');
      avatar.textContent = m.role === 'user' ? '🧑' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (m.role === 'user' ? 'user' : 'bot');
      bubble.innerHTML = escapeHtml(m.content).replace(/\n/g, '<br>');

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    });

    if (loading) {
      const row = document.createElement('div');
      row.className = 'msg-row';
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar bot';
      avatar.textContent = '🤖';
      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
      row.appendChild(avatar);
      row.appendChild(dots);
      messagesEl.appendChild(row);
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || loading) return;

    history.push({ role: 'user', content: text });
    inputEl.value = '';
    loading = true;
    sendBtn.disabled = true;
    renderMessages();

    try {
      const endpoint = window.location.origin + '/.netlify/functions/chat';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok) {
        history.push({ role: 'assistant', content: 'Грешка: ' + (data.error || 'неизвестна грешка') });
      } else {
        history.push({ role: 'assistant', content: data.reply || 'Празен отговор.' });
      }
    } catch (err) {
      history.push({ role: 'assistant', content: 'Мрежова грешка: ' + err.message });
    } finally {
      loading = false;
      sendBtn.disabled = !inputEl.value.trim();
      renderMessages();
    }
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => { sendBtn.disabled = !inputEl.value.trim() || loading; });
  inputEl.addEventListener('focus', () => inputWrapEl.classList.add('focused'));
  inputEl.addEventListener('blur', () => inputWrapEl.classList.remove('focused'));
  sendBtn.addEventListener('click', sendMessage);

  history.push({ role: 'assistant', content: 'Здравей, Деско! Аз съм PHANTOM AI — твоят личен асистент. С какво да помогна днес?' });
  sendBtn.disabled = true;
  renderMessages();
</script>
</body>
</html>
